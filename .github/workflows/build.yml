name: Build APK
 
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
 
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
 
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      # Runner ubuntu-latest ma już Android SDK (ANDROID_HOME). Wystarczy zaakceptować licencje.
      - name: Android SDK (licencje i pakiety)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true
 
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
 
      - name: Uprawnienia do gradlew
        run: chmod +x gradlew
 
      - name: Zbuduj APK (debug)
        run: ./gradlew assembleDebug --stacktrace
 
      - name: Wyślij APK jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: LimitCzasu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
